<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>CWA Demo — WebTransport + CRDT + Redis</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      canvas {
        border: 1px solid #333;
        cursor: crosshair;
        margin-top: 10px;
      }
      .colors button {
        width: 28px;
        height: 28px;
        border: 2px solid #999;
        cursor: pointer;
        margin-right: 4px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="drawBtn">➕ Vẽ hình vuông mới</button>
    <button id="reloadBtn">🔄 Tải lại trạng thái (giả lập join phòng)</button>
    <p>
      Tô màu (chọn 1 hình vuông trước):
      <span class="colors">
        <button data-color="#ef4444" style="background: #ef4444"></button>
        <button data-color="#3b82f6" style="background: #3b82f6"></button>
        <button data-color="#22c55e" style="background: #22c55e"></button>
        <button data-color="#eab308" style="background: #eab308"></button>
      </span>
    </p>
    <canvas id="board" width="400" height="300"></canvas>

    <p>
      <label
        ><input type="checkbox" id="lossSim" /> Mô phỏng mất gói Datagram
        (30%)</label
      >
      — 📡 Đã gửi: <b id="dgSent">0</b> · 🚫 Mô phỏng mất:
      <b id="dgDropped">0</b>
    </p>
    <div
      id="log"
      style="
        margin-top: 8px;
        height: 150px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 8px;
        font-family: monospace;
        font-size: 12px;
        background: #fafafa;
      "
    ></div>

    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const clientId = crypto.randomUUID().slice(0, 8);
      const elements = {}; // elementId -> { x, y, color }
      let selectedId = null;
      let draggingId = null;
      let remoteCursor = null; // { x, y } — vị trí con trỏ người KHÁC, nhận qua Datagram relay

      function logEvent(channel, text) {
        const color = channel === "STREAM" ? "#2563eb" : "#d97706";
        const line = document.createElement("div");
        line.innerHTML = `<b style="color:${color}">[${channel}]</b> ${text}`;
        const logEl = document.getElementById("log");
        logEl.prepend(line);
        while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
      }

      // Dán hash sha256 in ra từ console server vào đây
      const CERT_HASH = "Vzkt3snI+2vSksBCVK3p9ABWj4P8SGJloXZhp6lVOKs=";

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const [id, el] of Object.entries(elements)) {
          ctx.fillStyle = el.color || "#9ca3af";
          ctx.fillRect(el.x - 15, el.y - 15, 30, 30);
          if (id === selectedId) {
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(el.x - 17, el.y - 17, 34, 34);
          }
        }
        if (remoteCursor) {
          ctx.strokeStyle = "#d97706"; // cam — cùng màu nhãn [DATAGRAM] trong log
          ctx.setLineDash([3, 3]);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(remoteCursor.x, remoteCursor.y, 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      async function main() {
        const transport = new WebTransport("https://127.0.0.1:5000/wt", {
          serverCertificateHashes: [
            {
              algorithm: "sha-256",
              value: Uint8Array.from(atob(CERT_HASH), (c) => c.charCodeAt(0)),
            },
          ],
        });
        await transport.ready;
        console.log("connected, clientId =", clientId);

        async function sendOp(elementId, field, value) {
          logEvent("STREAM", `${field} → ${JSON.stringify(value)}`);
          const stream = await transport.createUnidirectionalStream();
          const writer = stream.getWriter();
          await writer.write(
            new TextEncoder().encode(
              JSON.stringify({
                elementId,
                field,
                value,
                time: [Date.now(), clientId],
              }),
            ),
          );
          await writer.close();
        }

        // Nhận datagram — giờ là cursor của NGƯỜI KHÁC (server đã relay, không còn echo)
        (async () => {
          const reader = transport.datagrams.readable.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const remote = JSON.parse(new TextDecoder().decode(value));
            remoteCursor = { x: remote.x, y: remote.y };
            render();
          }
        })();

        function concatChunks(chunks) {
          const total = chunks.reduce((sum, c) => sum + c.length, 0);
          const result = new Uint8Array(total);
          let offset = 0;
          for (const c of chunks) {
            result.set(c, offset);
            offset += c.length;
          }
          return result;
        }

        function applyOp(op) {
          elements[op.elementId] = elements[op.elementId] || {
            x: 0,
            y: 0,
            color: "#9ca3af",
          };
          if (op.field === "position") {
            elements[op.elementId].x = op.value.x;
            elements[op.elementId].y = op.value.y;
          }
          if (op.field === "color") elements[op.elementId].color = op.value;
          render();
          logEvent(
            "STREAM",
            `nhận từ người khác: ${op.field} → ${JSON.stringify(op.value)}`,
          );
        }

        // Nghe unidirectional stream do SERVER chủ động mở tới mình — đây là kênh
        // server dùng để đẩy op của người khác về real-time, không cần reload nữa.
        (async () => {
          const reader = transport.incomingUnidirectionalStreams.getReader();
          while (true) {
            const { done, value: stream } = await reader.read();
            if (done) break;
            const sReader = stream.getReader();
            const chunks = [];
            while (true) {
              const { done: d, value } = await sReader.read();
              if (d) break;
              chunks.push(value);
            }
            const op = JSON.parse(
              new TextDecoder().decode(concatChunks(chunks)),
            );
            applyOp(op);
          }
        })();

        async function loadState() {
          const stream = await transport.createBidirectionalStream();
          const writer = stream.writable.getWriter();
          const reader = stream.readable.getReader();
          await writer.write(new TextEncoder().encode("GET_STATE"));
          const { value } = await reader.read();
          const raw = JSON.parse(new TextDecoder().decode(value));

          for (const key in elements) delete elements[key]; // reset trước khi nạp lại
          for (const [hashField, fieldDataRaw] of Object.entries(raw)) {
            const [id, field] = hashField.split(":");
            const { value: fieldValue } = JSON.parse(fieldDataRaw);
            elements[id] = elements[id] || { x: 0, y: 0, color: "#9ca3af" };
            if (field === "position") {
              elements[id].x = fieldValue.x;
              elements[id].y = fieldValue.y;
            }
            if (field === "color") elements[id].color = fieldValue;
          }
          render();
          console.log(
            "state loaded:",
            Object.keys(elements).length,
            "elements",
          );
        }

        await loadState();

        // --- 1. Vẽ mới ---
        document.getElementById("drawBtn").addEventListener("click", () => {
          const id = crypto.randomUUID().slice(0, 8);
          const x = 50 + Math.random() * 300;
          const y = 50 + Math.random() * 200;
          elements[id] = { x, y, color: "#9ca3af" };
          render();
          sendOp(id, "position", { x, y });
        });

        // --- 2. Di chuyển (kéo thả) ---
        canvas.addEventListener("mousedown", (e) => {
          const hit = Object.entries(elements).find(
            ([, el]) =>
              Math.abs(e.offsetX - el.x) < 17 &&
              Math.abs(e.offsetY - el.y) < 17,
          );
          if (hit) {
            selectedId = draggingId = hit[0];
            render();
          }
        });
        canvas.addEventListener("mousemove", (e) => {
          if (!draggingId) return;
          elements[draggingId].x = e.offsetX;
          elements[draggingId].y = e.offsetY;
          render(); // optimistic update — không chờ server
        });
        canvas.addEventListener("mouseup", () => {
          if (!draggingId) return;
          const el = elements[draggingId];
          sendOp(draggingId, "position", { x: el.x, y: el.y }); // chỉ gửi 1 lần lúc thả tay
          draggingId = null;
        });

        // --- 3. Tô màu (demo CRDT field-level: field "color" độc lập với field "position") ---
        document
          .querySelectorAll(".colors button[data-color]")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              if (!selectedId) {
                alert("Chọn 1 hình vuông trước");
                return;
              }
              const color = btn.dataset.color;
              elements[selectedId].color = color;
              render();
              sendOp(selectedId, "color", color);
            });
          });

        document
          .getElementById("reloadBtn")
          .addEventListener("click", loadState);

        // --- Datagram: gửi vị trí con trỏ, throttle nhẹ — KHÔNG liên quan tới Redis ---
        let lastSent = 0;
        let dgSentCount = 0,
          dgDroppedCount = 0;
        const dgSentEl = document.getElementById("dgSent");
        const dgDroppedEl = document.getElementById("dgDropped");

        canvas.addEventListener("mousemove", async (e) => {
          if (Date.now() - lastSent < 100) return;
          lastSent = Date.now();

          // Mô phỏng mất gói: cố tình KHÔNG gửi — minh hoạ "mất vài gói vẫn ổn"
          if (
            document.getElementById("lossSim").checked &&
            Math.random() < 0.3
          ) {
            dgDroppedEl.textContent = ++dgDroppedCount;
            return;
          }

          dgSentEl.textContent = ++dgSentCount;
          const w = transport.datagrams.writable.getWriter();
          await w.write(
            new TextEncoder().encode(
              JSON.stringify({ clientId, x: e.offsetX, y: e.offsetY }),
            ),
          );
          w.releaseLock();
        });
      }

      main().catch(console.error);
    </script>
  </body>
</html>
