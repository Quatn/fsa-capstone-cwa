apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cwa
data:
  NODE_ENV: "production"
  WEB_URL: "VAR_WEB_URL"
  API_URL: "VAR_API_URL"
  HTTP3_URL: "VAR_HTTP3_URL"
  HTTP3_HOST: "VAR_HTTP3_HOST"
  DB_HOST: "VAR_DB_HOST"
  DB_PORT: "VAR_DB_PORT"
  REDIS_HOST: "VAR_REDIS_HOST"
  REDIS_PORT: "VAR_REDIS_PORT"
