apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cwa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: VAR_API_IMAGE:VAR_IMAGE_TAG
        ports:
        - containerPort: 8080
        env:
        - name: WEB_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: WEB_URL } }
        - name: API_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: API_URL } }
        - name: HTTP3_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: HTTP3_URL } }
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } }
        - name: REDIS_HOST
          valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_HOST } }
        - name: REDIS_PORT
          valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_PORT } }
        - name: DB_NAME
          valueFrom: { secretKeyRef: { name: app-secrets, key: DB_NAME } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_PASSWORD } }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
        - name: REFRESH_TOKEN_EXPIRATION_SECONDS
          valueFrom: { secretKeyRef: { name: app-secrets, key: REFRESH_TOKEN_EXPIRATION_SECONDS } }
        - name: ACCESS_TOKEN_EXPIRATION_SECONDS
          valueFrom: { secretKeyRef: { name: app-secrets, key: ACCESS_TOKEN_EXPIRATION_SECONDS } }
        # composed values — must come AFTER the vars they reference in this list
        - name: DB_URI
          value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
        - name: CORS_ORIGINS
          value: "$(WEB_URL)"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cwa
spec:
  selector:
    app: api
  ports:
  - port: 4000
    targetPort: 8080
